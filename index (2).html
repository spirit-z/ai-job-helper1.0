<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>AI求职助手·截图版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 14px 30px}header{padding:20px 4px 10px}h1{font-size:25px;margin:0 0 5px}.sub,.small{font-size:13px;color:#777;line-height:1.5}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0000000d}.upload{border:2px dashed #ccc;border-radius:15px;padding:25px 15px;text-align:center}.upload input{display:none}.pick{display:inline-block;background:#111;color:#fff;padding:12px 18px;border-radius:11px;font-weight:650}button{width:100%;padding:13px;border:0;border-radius:12px;background:#111;color:#fff;font-size:16px;font-weight:650;margin-top:10px}.secondary{background:#eee;color:#222}.preview{display:flex;gap:8px;overflow-x:auto;margin-top:12px}.thumb{width:90px;height:120px;object-fit:cover;border-radius:8px}.job{border:1px solid #eee;border-radius:14px;padding:14px;margin-top:10px}.top{display:flex;justify-content:space-between;gap:10px}.title{font-weight:700;line-height:1.4}.score{font-size:22px;font-weight:800}.green{color:#147a3d}.orange{color:#9a6200}.red{color:#b42318}.badge{display:inline-block;background:#f1f2f4;border-radius:7px;padding:5px 7px;margin:5px 4px 0 0;font-size:12px}.msg{background:#f7f7f8;border-radius:10px;padding:11px;font-size:13px;line-height:1.55;margin-top:10px}
</style></head><body><div class="app">
<header><h1>AI求职助手 · 截图版</h1><div class="sub">BOSS不能复制文字也没关系：直接截图 → 上传 → OCR识别 → 岗位评分。</div></header>
<div class="card"><div class="upload"><label class="pick">📸 选择岗位截图<input id="files" type="file" accept="image/*" multiple></label><div class="small" style="margin-top:10px">一次可选多张截图，同一个岗位的连续截图可一起选。</div></div><div id="preview" class="preview"></div><div id="status" class="small"></div><button onclick="runOCR()">识别并筛选</button><button class="secondary" onclick="clearAll()">清空</button></div>
<div id="out"></div>
<div class="card"><b>怎么用</b><p class="small">在BOSS截图 → 回到本页面上传 → 点“识别并筛选” → 优先处理绿色岗位。</p><p class="small">OCR组件从浏览器加载；识别在浏览器本地进行。截图过小、模糊或复杂排版可能识别不准，重要信息请人工核对。</p></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
let imgs=[];document.getElementById('files').onchange=e=>{imgs=[...e.target.files];document.getElementById('preview').innerHTML='';imgs.forEach(f=>{let im=document.createElement('img');im.src=URL.createObjectURL(f);im.className='thumb';document.getElementById('preview').appendChild(im)});document.getElementById('status').innerText='已选择 '+imgs.length+' 张截图'};
const tech=['AI','AIGC','SaaS','软件','企业服务','数字化','智能制造','半导体','芯片','电子元器件','自动化','科技','大模型','数据服务'];
const roles=['商务','BD','客户成功','客户运营','销售支持','销售运营','项目助理','项目专员','产品助理','产品运营','售前','解决方案','渠道','实施顾问','实施专员'];
const bad=['每日100通','每天100通','100+电话','100个电话','电话量KPI','纯电销','陌生电话','电话邀约','日均电话','电话考核','卖课','课程销售','招生','贷款','金融电销'];
const red=['押金','保证金','培训费','先交钱','收费入职','购买设备'];
function score(t){let s=50,p=[],r=[],x=t.toLowerCase();if(tech.some(k=>x.includes(k.toLowerCase()))){s+=18;p.push('科技/AI/半导体')}if(roles.some(k=>x.includes(k.toLowerCase()))){s+=12;p.push('商务/客户/项目')}if(/企业客户|b2b|工厂|品牌商|企业用户/.test(x)){s+=12;p.push('B2B/企业客户')}if(/公司提供|客户资源|客户线索|线索/.test(x)){s+=8;p.push('公司提供线索')}if(/培训|带教|新人/.test(x)){s+=4;p.push('有培训/带教')}if(/经验不限|无经验|接受应届|大专|本科优先|不限学历/.test(x)){s+=3;p.push('经验/学历门槛友好')}let b=bad.filter(k=>x.includes(k.toLowerCase()));if(b.length){s-=Math.min(42,b.length*14);r.push('高电话量/纯电销：'+b.join('、'))}let q=red.filter(k=>x.includes(k.toLowerCase()));if(q.length){s-=60;r.push('收费/押金风险：'+q.join('、'))}if(/卖课|课程销售|招生/.test(x)){s-=25;r.push('疑似培训/课程销售')}if(/无责底薪|月入2万|月入3万|月入5万|高提成/.test(x)){s-=6;r.push('夸张招聘话术，建议核实')}s=Math.max(0,Math.min(100,s));return{s,p,r,label:s>=75?'🟢 建议投':s>=58?'🟡 继续了解':'🔴 优先跳过',c:s>=75?'green':s>=58?'orange':'red'}}
function msg(){return '您好，我对贵司这个岗位比较感兴趣。我的经历更偏客户沟通和业务方向，目前希望往企业服务/科技行业发展。虽然没有完全对应的垂直行业经验，但愿意从商务沟通、客户跟进、项目协作等工作做起。想了解一下这个岗位主要是公司提供客户线索，还是以陌生开发为主？'}
async function runOCR(){if(!imgs.length){alert('先选择岗位截图');return}let st=document.getElementById('status');try{st.innerText='正在加载OCR……';let w=await Tesseract.createWorker('chi_sim+eng',1,{logger:m=>{if(m.status)st.innerText=m.status+' '+(m.progress?Math.round(m.progress*100)+'%':'')}});let text='';for(let i=0;i<imgs.length;i++){st.innerText='正在识别第 '+(i+1)+'/'+imgs.length+' 张';let z=await w.recognize(imgs[i]);text+=z.data.text+'\n'}await w.terminate();render(text);st.innerText='识别完成'}catch(e){st.innerText='识别失败：请检查网络或换清晰截图'}}
function render(text){let a=score(text),t=(text.match(/.{0,25}(销售|商务|运营|客户|项目|助理|顾问|专员).{0,25}/)||['截图岗位'])[0];document.getElementById('out').innerHTML='<div class="card job"><div class="top"><div><b>截图识别结果</b><div class="small">'+esc(t)+'</div></div><div class="score '+a.c+'">'+a.s+'</div></div><div class="'+a.c+'" style="font-weight:700;margin-top:5px">'+a.label+'</div><div>'+a.p.map(x=>'<span class="badge">＋'+esc(x)+'</span>').join('')+'</div>'+(a.r.length?'<div class="red" style="margin-top:8px">⚠ '+a.r.map(esc).join('<br>⚠ ')+'</div>':'<div class="green" style="margin-top:8px">暂无明显高风险关键词</div>')+'<div class="msg">'+esc(msg())+'</div><button class="secondary" onclick="navigator.clipboard.writeText('+JSON.stringify(msg())+').then(()=>this.innerText=\'已复制 ✓\')">复制开场话术</button></div><div class="card"><b>OCR文字</b><details><summary class="small">点开查看</summary><pre style="white-space:pre-wrap;font-size:12px">'+esc(text)+'</pre></details></div>'}
function clearAll(){imgs=[];document.getElementById('files').value='';document.getElementById('preview').innerHTML='';document.getElementById('out').innerHTML='';document.getElementById('status').innerText=''}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
